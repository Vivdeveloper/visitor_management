<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="light" />
		<meta name="theme-color" content="#0A3D91" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Precious Alloys" />
		<meta
			name="description"
			content="Precious Alloys Visitor Management — check-in, approvals, and gate passes"
		/>
		<link rel="manifest" href="/assets/visitor_management/frontend/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/assets/visitor_management/frontend/icons/icon-180.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/assets/visitor_management/frontend/icons/icon-192.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="/assets/visitor_management/frontend/vms-asset-index.css?v={{ vms_asset_v }}"
		/>
		<title>{{ vms_page_title }}</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				background: #f8fafc;
				font-family: Helvetica, "Helvetica Neue", Arial, sans-serif;
			}
			#root {
				min-height: 100vh;
				min-height: 100dvh;
			}
			@media (min-width: 768px) {
				body.vms-auth-route,
				body:has(.vm-auth-page) {
					background: #dfe6ef;
				}
			}
			.vms-boot {
				color: #64748b;
				padding: 2rem;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<script>
			window.csrf_token = "{{ vms_csrf_token }}";
			window.vms_csrf_token = window.csrf_token;
			window.vmsAssetV = "{{ vms_asset_v }}";
			window.vms_boot = {
				sitename: "{{ vms_sitename }}",
				socketio_port: {{ vms_socketio_port }},
				developer_mode: {{ vms_developer_mode }},
			};

			/* Capacitor WebView: patch DOM + clear boot markup before React loads. */
			(function () {
				function isCapNative() {
					try {
						return Boolean(
							window.Capacitor &&
								window.Capacitor.isNativePlatform &&
								window.Capacitor.isNativePlatform(),
						);
					} catch (e) {
						return false;
					}
				}

				if (typeof Node !== "undefined" && Node.prototype) {
					var origRemove = Node.prototype.removeChild;
					Node.prototype.removeChild = function (child) {
						if (child.parentNode !== this) {
							if (child.parentNode) {
								return origRemove.call(child.parentNode, child);
							}
							return child;
						}
						return origRemove.call(this, child);
					};
					var origInsert = Node.prototype.insertBefore;
					Node.prototype.insertBefore = function (newNode, ref) {
						if (ref && ref.parentNode !== this) {
							return origInsert.call(this, newNode, null);
						}
						return origInsert.call(this, newNode, ref);
					};
				}

				function swallowDomRace(err) {
					if (!err) return false;
					var name = err.name || "";
					var msg = String(err.message || err);
					return (
						name === "NotFoundError" &&
						(msg.indexOf("removeChild") !== -1 || msg.indexOf("insertBefore") !== -1)
					);
				}

				window.addEventListener(
					"error",
					function (ev) {
						if (swallowDomRace(ev.error)) {
							ev.preventDefault();
							return true;
						}
					},
					true,
				);
				window.addEventListener("unhandledrejection", function (ev) {
					if (swallowDomRace(ev.reason)) {
						ev.preventDefault();
					}
				});

				if (isCapNative() && "serviceWorker" in navigator) {
					navigator.serviceWorker.getRegistrations().then(function (regs) {
						regs.forEach(function (r) {
							r.unregister();
						});
					});
				}
			})();
		</script>
		<div id="root">
			<div class="vms-boot">Loading Visitor Management…</div>
		</div>
		<script>
			(function () {
				var root = document.getElementById("root");
				if (root) root.replaceChildren();
			})();
		</script>
		<script
			src="/assets/visitor_management/frontend/vms-app.js?v={{ vms_asset_v }}"
			type="module"
		></script>
	</body>
</html>
